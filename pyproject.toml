[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmgn-trading-bot"
version = "0.2.1"
description = "24/7 GMGN OpenAPI watchlist monitor with optional Telegram alerts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gmgn-trading-bot = "gmgn_trading_bot.cli:main"

[tool.setuptools.packages.find]
include = ["gmgn_trading_bot*"]
