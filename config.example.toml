# gmgn_trading_bot v0.2.2 — empat sinyal SMART SEROK
# Salin menjadi config.toml. Secret hanya di bot.env.

[gmgn]
host = "https://openapi.gmgn.ai"
web_host = "https://gmgn.ai"
chain = "sol"

[monitor]
# Level Engine saat ini tepat untuk candle 1H.
resolution = "1h"
poll_seconds = 60
request_spacing_seconds = 1.1
# Token baru langsung mengambil raw trades minimal 48 jam.
backfill_hours = 48
close_grace_seconds = 15

[storage]
# Watchlist dinamis, raw trades, level event, dan deduplikasi disimpan di sini.
sqlite_path = "var/gmgn_trading_bot.db"

[telegram]
# Kontrol memakai TELEGRAM_BOT_TOKEN dan TELEGRAM_CHAT_ID dari bot.env.

# Seed awal. Setelah start, watchlist dapat dikelola dari Telegram.
[[watchlist]]
mint = "7fDdLy2rmQKsPCkqUXEd1mN7yDfEzArc4VrctWmfkJBK"
symbol = "Z500"
enabled = true

# Slot kosong aman jika enabled=false.
[[watchlist]]
mint = ""
symbol = ""
enabled = false

# Alert yang diizinkan hanya:
# 1. RESISTANCE TERBENTUK
# 2. SUPPORT TERBENTUK
# 3. RETEST RESISTANCE — KEMUNGKINAN BREAKOUT
# 4. RETEST SUPPORT — KEMUNGKINAN BREAKDOWN
# Tidak ada CHART_BREAKOUT/CHART_BREAKDOWN. Auto-trade OFF.
